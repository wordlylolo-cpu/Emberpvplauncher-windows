name: Build and publish Linux Flatpak
on:
  push:
    branches: [linux-flatpak-release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-flatpak-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder weston dbus-x11
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Reconstruct the locked launcher source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,tarfile,shutil
          manifest=json.loads(Path('payload/manifest.json').read_text())
          data=b''.join(base64.b64decode(p.read_text()) for p in sorted(Path('payload').glob('*.b64')))
          assert hashlib.sha256(data).hexdigest()==manifest['sha256']
          Path('base-source.tar.gz').write_bytes(data)
          Path('source').mkdir()
          with tarfile.open('base-source.tar.gz') as t:t.extractall('source',filter='data')
          shutil.copytree('windows-overrides','source',dirs_exist_ok=True)
          shutil.copytree('linux-packaging','source/packaging/linux',dirs_exist_ok=True)
          PY
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: .flatpak-builder
          key: linux-kde610-x64-${{ github.sha }}
          restore-keys: linux-kde610-x64-
      - name: Install runtime, SDK, and JDK extension
        run: |
          flatpak-builder --user --assumeyes --install-deps-from=flathub --install-deps-only build-flatpak source/packaging/linux/org.emberpvp.EmberpvpLauncher.yml
      - name: Build and run compatibility tests
        run: |
          flatpak-builder --user --assumeyes --disable-rofiles-fuse --ccache --force-clean --build-only build-flatpak source/packaging/linux/org.emberpvp.EmberpvpLauncher.yml
      - name: Test 3D rendering and UI on native Wayland
        run: dbus-run-session -- bash source/packaging/linux/native-tests.sh tests
      - name: Package the Linux bundle and matching source
        run: |
          flatpak-builder --user --assumeyes --disable-rofiles-fuse --finish-only --repo=flatpak-repo build-flatpak source/packaging/linux/org.emberpvp.EmberpvpLauncher.yml
          mkdir -p linux-artifacts
          flatpak build-bundle flatpak-repo linux-artifacts/EmberpvpLauncher-Linux-x86_64.flatpak org.emberpvp.EmberpvpLauncher stable --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          tar -czf linux-artifacts/EmberpvpLauncher-Linux-corresponding-source.tar.gz -C source .
          cp source/packaging/linux/LINUX-BUILD.md linux-artifacts/Linux-README.md
          cd linux-artifacts
          sha256sum EmberpvpLauncher-Linux-x86_64.flatpak EmberpvpLauncher-Linux-corresponding-source.tar.gz Linux-README.md > Linux-SHA256SUMS.txt
      - name: Install the bundle for the runner user
        run: flatpak install --user --assumeyes --noninteractive ./linux-artifacts/EmberpvpLauncher-Linux-x86_64.flatpak
      - name: Verify installed bundle starts on native Wayland
        run: dbus-run-session -- bash source/packaging/linux/native-tests.sh bundle
      - uses: actions/upload-artifact@v4
        with:
          name: EmberpvpLauncher-Linux-x86_64
          path: linux-artifacts/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-build-diagnostics
          path: |
            .flatpak-builder/build/emberpvp*/_flatpak_build/Testing/Temporary/*
            .flatpak-builder/build/emberpvp*/_flatpak_build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/weston-emberpvp.log
            ${{ runner.temp }}/emberpvp-flatpak-startup.log
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .flatpak-builder
          key: linux-kde610-x64-${{ github.sha }}
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EmberpvpLauncher-Linux-x86_64
          path: linux-artifacts
      - name: Verify and publish Linux files alongside the Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd linux-artifacts
          sha256sum -c Linux-SHA256SUMS.txt
          cd ..
          python3 linux-packaging/publish.py
